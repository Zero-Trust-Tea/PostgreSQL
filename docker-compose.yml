services:
    db:
        image: postgres:15-alpine
        container_name: pgsql-db-1
        environment:
            POSTGRES_DB: ${PGDATABASE}
            POSTGRES_USER: ${PGUSER}
            POSTGRES_PASSWORD: ${PGPASSWORD}
        volumes:
        - ./:/script
        - ./main.sql:/docker-entrypoint-initdb.d/main.sql
        ports:
        - "${PGPORT}:5432"
